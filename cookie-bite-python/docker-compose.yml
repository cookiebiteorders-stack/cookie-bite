# Cookie Bite Python layer — local development
# Usage (from cookie-bite-python/):
#   cp .env.example .env   # fill DATABASE_URL, keys
#   docker compose up --build

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    networks:
      - cookie-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cookie-net

networks:
  cookie-net:
    driver: bridge

volumes:
  redis-data:
