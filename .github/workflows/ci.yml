name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          COOKIE_BITE_FAIL_ON_MISSING_ENV: "false"

      - name: Verify standalone serves CSS
        run: npm run verify:standalone-css
        env:
          NODE_ENV: production
          COOKIE_BITE_FAIL_ON_MISSING_ENV: "false"

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        run: npx playwright test e2e/smoke.spec.ts
        env:
          CI: "true"
          COOKIE_BITE_FAIL_ON_MISSING_ENV: "false"

  supabase-security:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Detect Supabase credentials
        id: supabase
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase env not fully set; skipping read-only DB checks."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - uses: actions/setup-node@v4
        if: steps.supabase.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
        if: steps.supabase.outputs.ready == 'true'

      - name: Supabase security-health (read-only)
        if: steps.supabase.outputs.ready == 'true'
        run: node scripts/supabase-security-check.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Supabase core tables snapshot
        if: steps.supabase.outputs.ready == 'true'
        run: node scripts/supabase-schema-snapshot-check.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
