<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"/>
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --color-text-primary:#1c1917;
  --color-text-secondary:#57534e;
  --color-text-tertiary:#78716c;
  --color-text-info:#1d4ed8;
  --color-text-success:#15803d;
  --color-text-warning:#9a3412;
  --color-background-primary:#fafaf9;
  --color-background-secondary:#f5f5f4;
  --color-background-info:#eff6ff;
  --color-background-success:#f0fdf4;
  --color-background-warning:#fff7ed;
  --color-border-secondary:#d6d3d1;
  --color-border-tertiary:#e7e5e4;
  --color-border-success:#86efac;
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
html,body{min-height:100%;margin:0;background:var(--color-background-secondary);font-family:var(--font-sans);}
body{padding:10px 12px 16px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{display:flex;flex-direction:column;height:760px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);}
.app-hdr{padding:10px 16px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;justify-content:space-between;}
.app-hdr h2{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.app-hdr span{font-size:11px;color:var(--color-text-tertiary);}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:210px;min-width:210px;border-right:0.5px solid var(--color-border-tertiary);overflow-y:auto;background:var(--color-background-secondary);}
.sb-section{padding:8px 12px 4px;font-size:9px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.08em;}
.tbtn{width:100%;text-align:left;background:none;border:none;border-bottom:0.5px solid var(--color-border-tertiary);padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .12s;}
.tbtn:hover{background:var(--color-background-primary);}
.tbtn.active{background:var(--color-background-primary);border-left:2px solid #1a1a2e;}
.tbtn .ti{font-size:14px;color:var(--color-text-tertiary);}
.tbtn.active .ti{color:#1a1a2e;}
.tbtn span{font-size:12px;color:var(--color-text-secondary);line-height:1.3;}
.tbtn.active span{color:var(--color-text-primary);font-weight:500;}
.preview{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.phdr{padding:9px 14px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;}
.phdr-l h3{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.phdr-l p{font-size:11px;color:var(--color-text-tertiary);margin-top:1px;}
.cbtn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 10px;font-size:11px;cursor:pointer;color:var(--color-text-secondary);display:flex;align-items:center;gap:5px;}
.cbtn:hover{background:var(--color-background-secondary);}
.cbtn.ok{color:var(--color-text-success);border-color:var(--color-border-success);}
.canvas{flex:1;overflow-y:auto;padding:18px;background:#e8e8e8;}
.ew{max-width:520px;margin:0 auto;background:#fff;border-radius:6px;font-family:Arial,sans-serif;}
.eh{background:#1a1a2e;padding:22px 28px;border-radius:6px 6px 0 0;}
.eh .logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:2px;}
.eb{padding:28px 28px 20px;}
.eb h1{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:10px;}
.eb p{font-size:14px;color:#555;line-height:1.7;margin-bottom:12px;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:14px;}
.tag.green{background:#e8f5e9;color:#2e7d32;}
.tag.blue{background:#e3f2fd;color:#1565c0;}
.tag.amber{background:#fff8e1;color:#e65100;}
.tag.red{background:#fce4ec;color:#c62828;}
.tag.purple{background:#ede7f6;color:#4527a0;}
.cta{display:inline-block;background:#1a1a2e;color:#fff;padding:12px 26px;border-radius:5px;text-decoration:none;font-size:13px;font-weight:700;margin:10px 0 18px;}
.ibox{background:#f5f6fa;border-left:3px solid #1a1a2e;padding:12px 14px;border-radius:0 5px 5px 0;margin:12px 0;}
.ibox p{font-size:13px;color:#444;line-height:1.6;margin:0;}
.otp-box{background:#f0f4ff;border-radius:8px;padding:20px;text-align:center;margin:18px 0;}
.otp-box .otp{font-size:32px;font-weight:700;color:#1a1a2e;letter-spacing:8px;}
.otp-box p{font-size:12px;color:#888;margin-top:6px;}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.kpi2 .k{background:#f5f6fa;border-radius:6px;padding:12px;}
.kpi2 .k .kl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.06em;}
.kpi2 .k .kv{font-size:20px;font-weight:700;color:#1a1a2e;margin-top:3px;}
.steps{margin:14px 0;}
.step{display:flex;gap:12px;margin-bottom:13px;align-items:flex-start;}
.snum{width:26px;height:26px;min-width:26px;background:#1a1a2e;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.scnt h4{font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
.scnt p{font-size:12px;color:#666;margin:0;line-height:1.5;}
.pts-box{background:#1a1a2e;border-radius:8px;padding:18px 22px;text-align:center;margin:16px 0;}
.pts-box .pts{font-size:36px;font-weight:700;color:#fff;}
.pts-box p{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px;}
.divider{border:none;border-top:1px solid #eee;margin:14px 0;}
.ef{background:#f5f6fa;padding:14px 28px;border-radius:0 0 6px 6px;text-align:center;}
.ef p{font-size:11px;color:#aaa;line-height:1.8;}
.ef a{color:#888;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0;table-layout:fixed;}
.tbl th{background:#f5f6fa;padding:8px 10px;text-align:left;color:#888;font-size:10px;text-transform:uppercase;}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#333;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;}
.badge.g{background:#e8f5e9;color:#2e7d32;}
.badge.r{background:#fce4ec;color:#c62828;}
.badge.b{background:#e3f2fd;color:#1565c0;}
.badge.y{background:#fff8e1;color:#e65100;}
</style>

<h2 class="sr-only">Missing email templates for e-commerce: 10 new templates covering verification, cancellation, back-in-stock, and more</h2>
<div class="app">
  <div class="app-hdr">
    <h2>Missing email templates — 10 new additions</h2>
    <span>Fills gaps in your existing 9</span>
  </div>
  <div class="body">
    <div class="sidebar" id="sb"></div>
    <div class="preview">
      <div class="phdr">
        <div class="phdr-l"><h3 id="pt"></h3><p id="ps"></p></div>
        <button class="cbtn" id="cb" onclick="doCopy()"><i class="ti ti-copy" aria-hidden="true"></i> Copy HTML</button>
      </div>
      <div class="canvas" id="cv"></div>
    </div>
  </div>
</div>

<script>
const sections = [
  {label:'Account & Security', ids:['verify','security-alert','2fa']},
  {label:'Order Lifecycle', ids:['cancel','delay','invoice']},
  {label:'Retention & Growth', ids:['winback','birthday','back-in-stock','loyalty']}
];

const T = {
  'verify':{icon:'ti-mail-check',label:'Email Verification',sub:'Subject: Verify your email address',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag blue">Account Setup</span><h1>Verify your email address</h1><p>Hi {{first_name}},</p><p>Thanks for registering. Please verify your email to activate your account and start shopping.</p><div class="otp-box"><div class="otp">{{verification_code}}</div><p>Enter this code on the verification page. Expires in {{expiry_time}}.</p></div><div style="text-align:center;"><a class="cta" href="#">Verify My Email</a></div><div class="ibox"><p>Didn't create an account? You can safely ignore this email — no action is needed.</p></div></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Privacy Policy</a></p></div></div>`},
  'security-alert':{icon:'ti-shield-lock',label:'Security Alert',sub:'Subject: Your account details were changed',html:`<div class="ew"><div class="eh" style="background:#7d1a1a;"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag red">Security Notice</span><h1>Your account was updated</h1><p>Hi {{first_name}},</p><p>We noticed a change to your account on <strong>{{change_date}}</strong> at <strong>{{change_time}}</strong> from <strong>{{device_info}}</strong>.</p><table class="tbl"><thead><tr><th>Change</th><th>Details</th></tr></thead><tbody><tr><td>{{change_type}}</td><td>{{change_detail}}</td></tr><tr><td>IP Address</td><td>{{ip_address}}</td></tr><tr><td>Location</td><td>{{location}}</td></tr></tbody></table><div class="ibox" style="border-left-color:#c62828;background:#fce4ec;"><p style="color:#7d1a1a;"><strong>Not you?</strong> Secure your account immediately by resetting your password.</p></div><div style="text-align:center;"><a class="cta" style="background:#7d1a1a;" href="#">Secure My Account</a></div></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Help Center</a> · <a href="#">Privacy Policy</a></p></div></div>`},
  '2fa':{icon:'ti-device-mobile',label:'2FA Login Code',sub:'Subject: Your login verification code',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag blue">Login Verification</span><h1>Your one-time login code</h1><p>Hi {{first_name}},</p><p>Use the code below to complete your sign-in. This code is valid for <strong>{{expiry_minutes}} minutes</strong> and can only be used once.</p><div class="otp-box"><div class="otp">{{otp_code}}</div><p>Do not share this code with anyone.</p></div><div class="ibox"><p>Signing in from: <strong>{{device_info}}</strong> · {{login_location}}<br>If this wasn't you, <a href="#" style="color:#1a1a2e;">reset your password immediately</a>.</p></div></div><div class="ef"><p>© 2025 [Your Store] · This is an automated security email. <a href="#">Help</a></p></div></div>`},
  'cancel':{icon:'ti-x',label:'Order Cancellation',sub:'Subject: Your order #{{order_number}} has been cancelled',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag red">Order Cancelled</span><h1>Your order has been cancelled</h1><p>Hi {{first_name}},</p><p>Your order <strong>#{{order_number}}</strong> placed on {{order_date}} has been successfully cancelled as requested.</p><div class="kpi2"><div class="k"><div class="kl">Order Total</div><div class="kv">{{order_total}}</div></div><div class="k"><div class="kl">Refund Method</div><div class="kv" style="font-size:14px;">{{payment_method}}</div></div></div><div class="ibox"><p>Your refund of <strong>{{refund_amount}}</strong> will be processed within <strong>{{processing_days}} business days</strong> to your original payment method.</p></div><p>Changed your mind? You can re-order anytime.</p><div style="text-align:center;"><a class="cta" href="#">Shop Again</a></div><div class="divider"></div><p style="font-size:12px;color:#aaa;">Cancellation reason: {{cancel_reason}}</p></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Contact Support</a> · <a href="#">Unsubscribe</a></p></div></div>`},
  'delay':{icon:'ti-clock-exclamation',label:'Shipping Delay',sub:'Subject: Update on your order #{{order_number}}',html:`<div class="ew"><div class="eh" style="background:#7d4e00;"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag amber">Shipping Update</span><h1>Your order is slightly delayed</h1><p>Hi {{first_name}},</p><p>We sincerely apologise — your order <strong>#{{order_number}}</strong> is experiencing an unexpected delay. We know your time matters, and we're working hard to resolve this.</p><div class="ibox" style="border-left-color:#e65100;background:#fff8e1;"><p style="color:#7d4e00;"><strong>Previous delivery date:</strong> {{original_date}}<br><strong>New estimated delivery:</strong> {{new_date}}<br><strong>Reason:</strong> {{delay_reason}}</p></div><div class="steps"><div class="step"><div class="snum">1</div><div class="scnt"><h4>Order dispatched</h4><p>Left our warehouse on {{dispatch_date}}.</p></div></div><div class="step"><div class="snum">2</div><div class="scnt"><h4>In transit</h4><p>Currently with {{carrier_name}} — tracking: {{tracking_number}}</p></div></div><div class="step"><div class="snum">3</div><div class="scnt"><h4>New delivery window</h4><p>Expected between {{new_date_from}} and {{new_date_to}}.</p></div></div></div><div style="text-align:center;"><a class="cta" href="#">Track My Order</a></div><p style="font-size:12px;color:#aaa;">As an apology, use <strong>{{apology_code}}</strong> for {{discount}}% off your next order.</p></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Unsubscribe</a> · <a href="#">Help Center</a></p></div></div>`},
  'invoice':{icon:'ti-receipt',label:'Invoice / Receipt',sub:'Subject: Invoice #{{invoice_number}} for your order',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag green">Invoice</span><h1>Tax invoice</h1><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><div><p style="font-size:12px;color:#999;margin:0;">Billed to</p><p style="font-size:13px;color:#333;margin:2px 0;font-weight:700;">{{customer_name}}</p><p style="font-size:12px;color:#666;margin:0;">{{billing_address}}</p><p style="font-size:12px;color:#666;margin:0;">VAT: {{vat_number}}</p></div><div style="text-align:right;"><p style="font-size:12px;color:#999;margin:0;">Invoice #</p><p style="font-size:14px;color:#1a1a2e;font-weight:700;margin:2px 0;">{{invoice_number}}</p><p style="font-size:12px;color:#666;margin:0;">Date: {{invoice_date}}</p><p style="font-size:12px;color:#666;margin:0;">Due: {{due_date}}</p></div></div><table class="tbl"><thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead><tbody><tr><td>{{item_1}}</td><td>{{qty_1}}</td><td>{{price_1}}</td><td>{{total_1}}</td></tr><tr><td>{{item_2}}</td><td>{{qty_2}}</td><td>{{price_2}}</td><td>{{total_2}}</td></tr><tr><td colspan="3" style="text-align:right;color:#888;">Subtotal</td><td style="font-weight:600;">{{subtotal}}</td></tr><tr><td colspan="3" style="text-align:right;color:#888;">Tax ({{tax_rate}}%)</td><td style="font-weight:600;">{{tax_amount}}</td></tr><tr><td colspan="3" style="text-align:right;color:#1a1a2e;font-weight:700;background:#f5f6fa;">Total</td><td style="font-weight:700;color:#1a1a2e;background:#f5f6fa;">{{grand_total}}</td></tr></tbody></table><div style="text-align:center;"><a class="cta" href="#">Download PDF Invoice</a></div></div><div class="ef"><p>© 2025 [Your Store] · Company Reg: {{company_reg}} · <a href="#">Privacy Policy</a></p></div></div>`},
  'winback':{icon:'ti-heart',label:'Win-Back Email',sub:'Subject: We miss you — here\'s a gift',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag purple">We miss you</span><h1>It's been a while, {{first_name}}</h1><p>Hi {{first_name}},</p><p>We noticed you haven't shopped with us in <strong>{{days_inactive}} days</strong> and we'd love to welcome you back. A lot has changed — new arrivals, better prices, and an exclusive offer just for you.</p><div style="background:#f0f4ff;border-radius:8px;padding:20px 24px;text-align:center;margin:18px 0;"><p style="font-size:12px;color:#888;margin-bottom:6px;">YOUR EXCLUSIVE CODE</p><div style="font-size:26px;font-weight:700;color:#1a1a2e;letter-spacing:4px;">{{promo_code}}</div><p style="font-size:13px;color:#555;margin-top:6px;">{{discount}}% off your next order — valid until {{expiry_date}}</p></div><div style="text-align:center;"><a class="cta" href="#">Shop New Arrivals</a></div><div class="divider"></div><p style="font-size:12px;color:#aaa;">If you'd rather not hear from us, you can <a href="#" style="color:#888;">unsubscribe here</a> — no hard feelings.</p></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div></div>`},
  'birthday':{icon:'ti-confetti',label:'Birthday Offer',sub:'Subject: Happy Birthday, {{first_name}}! A gift inside',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag purple">Happy Birthday!</span><h1>Your birthday gift is here</h1><p>Hi {{first_name}},</p><p>Wishing you a wonderful birthday from all of us at <strong>[Your Store]</strong>. To celebrate your special day, we've put together a gift just for you — no strings attached.</p><div class="pts-box"><div class="pts">{{discount}}% OFF</div><p>Use code <strong>{{birthday_code}}</strong> at checkout</p></div><div class="ibox"><p>Valid from <strong>{{valid_from}}</strong> to <strong>{{valid_to}}</strong>. Applies to all products, no minimum order. One use per customer.</p></div><div style="text-align:center;"><a class="cta" href="#">Claim My Birthday Gift</a></div></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div></div>`},
  'back-in-stock':{icon:'ti-bell',label:'Back in Stock',sub:'Subject: Good news — {{product_name}} is back!',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag green">Back in Stock</span><h1>Great news — it's back!</h1><p>Hi {{first_name}},</p><p>You asked us to notify you, and we're happy to confirm that <strong>{{product_name}}</strong> is back in stock and ready to order.</p><div class="kpi2"><div class="k"><div class="kl">Product</div><div class="kv" style="font-size:14px;">{{product_name}}</div></div><div class="k"><div class="kl">Price</div><div class="kv">{{product_price}}</div></div></div><div class="ibox"><p>Stock is limited — we can't guarantee availability. Order now to avoid missing out again.</p></div><div style="text-align:center;"><a class="cta" href="#">Buy Now</a></div><div class="divider"></div><p style="font-size:12px;color:#aaa;">You're receiving this because you signed up for a restock alert. <a href="#" style="color:#888;">Manage alerts</a>.</p></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div></div>`},
  'loyalty':{icon:'ti-star',label:'Loyalty & Rewards',sub:'Subject: You\'ve earned {{points}} points!',html:`<div class="ew"><div class="eh"><div class="logo">YOUR STORE</div></div><div class="eb"><span class="tag purple">Rewards Update</span><h1>You've earned new points!</h1><p>Hi {{first_name}},</p><p>Thanks to your recent purchase, your rewards balance just got a boost. Here's your latest loyalty snapshot:</p><div class="pts-box"><div class="pts">{{total_points}}</div><p>Total reward points · {{tier_name}} member</p></div><div class="kpi2"><div class="k"><div class="kl">Points Earned</div><div class="kv">+{{earned_points}}</div></div><div class="k"><div class="kl">Points to Next Tier</div><div class="kv">{{points_to_next}}</div></div></div><div class="steps"><div class="step"><div class="snum">1</div><div class="scnt"><h4>{{tier_1}} · 0 – {{t1_max}} pts</h4><p>Entry level benefits</p></div></div><div class="step"><div class="snum">2</div><div class="scnt"><h4>{{tier_2}} · {{t2_min}} – {{t2_max}} pts</h4><p>Free shipping on all orders</p></div></div><div class="step"><div class="snum">3</div><div class="scnt"><h4>{{tier_3}} · {{t3_min}}+ pts</h4><p>Exclusive deals and priority support</p></div></div></div><div style="text-align:center;"><a class="cta" href="#">Redeem My Points</a></div></div><div class="ef"><p>© 2025 [Your Store] · <a href="#">Unsubscribe</a> · <a href="#">Rewards Terms</a></p></div></div>`}
};

let active = 'verify';

function render(){
  const sb = document.getElementById('sb');
  sb.innerHTML = sections.map(s=>`
    <div class="sb-section">${s.label}</div>
    ${s.ids.map(id=>`<button class="tbtn ${id===active?'active':''}" onclick="sel('${id}')">
      <i class="ti ${T[id].icon}" aria-hidden="true"></i>
      <span>${T[id].label}</span>
    </button>`).join('')}
  `).join('');
  const t = T[active];
  document.getElementById('pt').textContent = t.label;
  document.getElementById('ps').textContent = t.sub;
  document.getElementById('cv').innerHTML = t.html;
  const b = document.getElementById('cb');
  b.classList.remove('ok');
  b.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';
}

function sel(id){ active=id; render(); }

function doCopy(){
  navigator.clipboard.writeText(T[active].html).then(()=>{
    const b=document.getElementById('cb');
    b.classList.add('ok');
    b.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> Copied!';
    setTimeout(()=>{b.classList.remove('ok');b.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';},2000);
  });
}

render();
</script>
</body></html>
