<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"/>
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --color-text-primary:#1c1917;
  --color-text-secondary:#57534e;
  --color-text-tertiary:#78716c;
  --color-text-info:#1d4ed8;
  --color-text-success:#15803d;
  --color-text-warning:#9a3412;
  --color-background-primary:#fafaf9;
  --color-background-secondary:#f5f5f4;
  --color-background-info:#eff6ff;
  --color-background-success:#f0fdf4;
  --color-background-warning:#fff7ed;
  --color-border-secondary:#d6d3d1;
  --color-border-tertiary:#e7e5e4;
  --color-border-success:#86efac;
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
html,body{min-height:100%;margin:0;background:var(--color-background-secondary);font-family:var(--font-sans);}
body{padding:10px 12px 16px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{display:flex;flex-direction:column;height:780px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);}
.top-tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);}
.tab-btn{flex:1;padding:11px 8px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:2px solid transparent;transition:all .15s;}
.tab-btn.active{color:var(--color-text-primary);border-bottom:2px solid var(--color-text-primary);background:var(--color-background-primary);font-weight:500;}
.tab-btn:hover:not(.active){background:var(--color-background-primary);}
.body-row{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;min-width:200px;border-right:0.5px solid var(--color-border-tertiary);overflow-y:auto;background:var(--color-background-secondary);}
.tmpl-btn{width:100%;text-align:left;background:none;border:none;border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .12s;}
.tmpl-btn:hover{background:var(--color-background-primary);}
.tmpl-btn.active{background:var(--color-background-primary);border-left:2px solid var(--color-text-primary);}
.tmpl-btn .ti{font-size:15px;color:var(--color-text-tertiary);}
.tmpl-btn.active .ti{color:var(--color-text-primary);}
.tmpl-btn span{font-size:12px;color:var(--color-text-secondary);line-height:1.3;}
.tmpl-btn.active span{color:var(--color-text-primary);font-weight:500;}
.preview{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.prev-hdr{padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;}
.prev-hdr-info h3{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.prev-hdr-info p{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;}
.copy-btn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 11px;font-size:11px;cursor:pointer;color:var(--color-text-secondary);display:flex;align-items:center;gap:5px;transition:all .15s;}
.copy-btn:hover{background:var(--color-background-secondary);}
.copy-btn.ok{color:var(--color-text-success);border-color:var(--color-border-success);}
.canvas{flex:1;overflow-y:auto;padding:20px;background:#ebebeb;}

.doc-wrap{max-width:540px;margin:0 auto;background:#fff;font-family:Arial,sans-serif;border-radius:6px;}
.doc-head{background:#1a1a2e;padding:24px 28px;border-radius:6px 6px 0 0;}
.doc-head .store{font-size:18px;font-weight:700;color:#fff;letter-spacing:2px;}
.doc-head .rtype{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;letter-spacing:.08em;text-transform:uppercase;}
.doc-head .rtitle{font-size:20px;font-weight:700;color:#fff;margin-top:8px;}
.doc-meta{display:flex;gap:0;border-bottom:1px solid #eee;}
.doc-meta-item{flex:1;padding:12px 16px;border-right:1px solid #eee;}
.doc-meta-item:last-child{border-right:none;}
.doc-meta-item .lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.06em;}
.doc-meta-item .val{font-size:13px;color:#222;font-weight:600;margin-top:2px;}
.doc-body{padding:20px 24px;}
.doc-body h2{font-size:13px;font-weight:700;color:#1a1a2e;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em;}
.doc-body h2:first-child{margin-top:0;}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.kpi{background:#f5f6fa;border-radius:6px;padding:12px;}
.kpi .k-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.06em;}
.kpi .k-val{font-size:18px;font-weight:700;color:#1a1a2e;margin-top:3px;}
.kpi .k-chg{font-size:11px;margin-top:2px;}
.kpi .k-chg.up{color:#2e7d32;}
.kpi .k-chg.dn{color:#c62828;}
.doc-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.doc-table th{background:#f5f6fa;padding:8px 10px;text-align:left;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.doc-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#333;}
.doc-table tr:last-child td{border-bottom:none;}
.doc-table .tot td{font-weight:700;color:#1a1a2e;background:#f5f6fa;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;}
.badge.g{background:#e8f5e9;color:#2e7d32;}
.badge.r{background:#fce4ec;color:#c62828;}
.badge.y{background:#fff8e1;color:#f57c00;}
.badge.b{background:#e3f2fd;color:#1565c0;}
.divider{border:none;border-top:1px solid #eee;margin:14px 0;}
.doc-footer{background:#f5f6fa;padding:14px 24px;border-radius:0 0 6px 6px;display:flex;justify-content:space-between;align-items:center;}
.doc-footer p{font-size:10px;color:#aaa;}
.note-box{background:#f0f4ff;border-left:3px solid #1a1a2e;padding:10px 14px;border-radius:0 5px 5px 0;margin:12px 0;}
.note-box p{font-size:12px;color:#444;line-height:1.6;}
.chart-bar-wrap{margin:12px 0;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.bar-row .lbl{font-size:11px;color:#555;width:70px;flex-shrink:0;text-align:right;}
.bar-track{flex:1;background:#eee;border-radius:3px;height:14px;}
.bar-fill{height:14px;border-radius:3px;background:#1a1a2e;}
.bar-row .bval{font-size:11px;color:#222;font-weight:600;width:44px;flex-shrink:0;}

.email-wrap{max-width:540px;margin:0 auto;background:#fff;border-radius:6px;font-family:Arial,sans-serif;}
.email-head{background:#1a1a2e;padding:20px 28px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;}
.email-head .store{font-size:16px;font-weight:700;color:#fff;letter-spacing:2px;}
.email-head .period{font-size:11px;color:rgba(255,255,255,.6);}
.email-body{padding:24px 28px;}
.email-body h1{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px;}
.email-body p{font-size:13px;color:#555;line-height:1.7;margin-bottom:12px;}
.email-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0;}
.email-kpi .ek{background:#f5f6fa;border-radius:6px;padding:12px 14px;}
.email-kpi .ek .el{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.06em;}
.email-kpi .ek .ev{font-size:20px;font-weight:700;color:#1a1a2e;margin-top:3px;}
.email-kpi .ek .ec{font-size:11px;margin-top:2px;}
.email-kpi .ek .ec.up{color:#2e7d32;}
.email-kpi .ek .ec.dn{color:#c62828;}
.email-table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0;table-layout:fixed;}
.email-table th{background:#f5f6fa;padding:8px 10px;text-align:left;color:#888;font-size:10px;text-transform:uppercase;}
.email-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#333;}
.cta{display:inline-block;background:#1a1a2e;color:#fff;padding:10px 22px;border-radius:5px;text-decoration:none;font-size:13px;font-weight:600;margin:10px 0;}
.email-footer-b{background:#f5f6fa;padding:14px 28px;border-radius:0 0 6px 6px;}
.email-footer-b p{font-size:11px;color:#aaa;text-align:center;}

.dash-wrap{max-width:600px;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;}
.dash-nav{background:#1a1a2e;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
.dash-nav .store{font-size:14px;font-weight:700;color:#fff;letter-spacing:1.5px;}
.dash-nav .nav-items{display:flex;gap:18px;}
.dash-nav .nav-items span{font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;}
.dash-nav .nav-items span.act{color:#fff;}
.dash-body{padding:18px 20px;}
.dash-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
.dash-sub{font-size:11px;color:#999;margin-bottom:16px;}
.dash-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.dk{background:#f5f6fa;border-radius:6px;padding:10px 12px;}
.dk .dl{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;}
.dk .dv{font-size:16px;font-weight:700;color:#1a1a2e;margin-top:2px;}
.dk .dc{font-size:10px;margin-top:1px;}
.dk .dc.up{color:#2e7d32;}
.dk .dc.dn{color:#c62828;}
.dash-chart-area{margin-bottom:18px;}
.dash-chart-area h3{font-size:11px;font-weight:700;color:#1a1a2e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.mini-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.mini-bar-row .ml{font-size:10px;color:#888;width:28px;flex-shrink:0;text-align:right;}
.mini-bar-track{flex:1;background:#eee;border-radius:2px;height:10px;}
.mini-bar-fill{height:10px;border-radius:2px;}
.mini-bar-row .mv{font-size:10px;color:#333;font-weight:600;width:40px;flex-shrink:0;}
.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.dash-panel{background:#f5f6fa;border-radius:6px;padding:12px;}
.dash-panel h3{font-size:10px;font-weight:700;color:#1a1a2e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.dash-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;}
.dash-row .dr-l{color:#555;}
.dash-row .dr-r{font-weight:600;color:#1a1a2e;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
.status-dot.g{background:#2e7d32;}
.status-dot.y{background:#f57c00;}
.status-dot.r{background:#c62828;}
.dash-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;}
.dash-table th{padding:7px 8px;text-align:left;color:#999;font-size:9px;text-transform:uppercase;background:#f5f6fa;}
.dash-table td{padding:7px 8px;border-bottom:1px solid #f0f0f0;color:#333;}
.dash-footer{background:#f5f6fa;padding:10px 20px;display:flex;justify-content:space-between;}
.dash-footer p{font-size:10px;color:#bbb;}
</style>

<h2 class="sr-only">Report templates viewer with document, email, and dashboard report types for e-commerce</h2>
<div class="app">
  <div class="top-tabs" id="tabs"></div>
  <div class="body-row">
    <div class="sidebar" id="sidebar"></div>
    <div class="preview">
      <div class="prev-hdr">
        <div class="prev-hdr-info">
          <h3 id="prev-title">Monthly Sales Report</h3>
          <p id="prev-desc">Business document · Internal & management</p>
        </div>
        <button class="copy-btn" id="copy-btn" onclick="doCopy()">
          <i class="ti ti-copy" aria-hidden="true"></i> Copy HTML
        </button>
      </div>
      <div class="canvas" id="canvas"></div>
    </div>
  </div>
</div>

<script>
const cats = [
  {id:'doc', icon:'ti-file-text', label:'Business Reports'},
  {id:'email', icon:'ti-mail', label:'Email Reports'},
  {id:'dash', icon:'ti-layout-dashboard', label:'Dashboards'}
];

const templates = {
  doc: [
    {
      id:'monthly-sales', icon:'ti-chart-bar', label:'Monthly Sales Report', audience:'Internal · Management',
      html:`<div class="doc-wrap">
        <div class="doc-head"><div class="store">YOUR STORE</div><div class="rtype">Business Report</div><div class="rtitle">Monthly Sales Report</div></div>
        <div class="doc-meta">
          <div class="doc-meta-item"><div class="lbl">Period</div><div class="val">{{month_year}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Prepared by</div><div class="val">{{author_name}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Date issued</div><div class="val">{{issue_date}}</div></div>
        </div>
        <div class="doc-body">
          <h2>Key performance indicators</h2>
          <div class="kpi-row">
            <div class="kpi"><div class="k-lbl">Total Revenue</div><div class="k-val">{{total_revenue}}</div><div class="k-chg up">+{{revenue_growth}}% vs last month</div></div>
            <div class="kpi"><div class="k-lbl">Orders</div><div class="k-val">{{total_orders}}</div><div class="k-chg up">+{{order_growth}}% vs last month</div></div>
            <div class="kpi"><div class="k-lbl">Avg Order Value</div><div class="k-val">{{avg_order_value}}</div><div class="k-chg dn">{{aov_change}}% vs last month</div></div>
          </div>
          <div class="kpi-row">
            <div class="kpi"><div class="k-lbl">Conversion Rate</div><div class="k-val">{{conversion_rate}}%</div><div class="k-chg up">+{{conv_change}}%</div></div>
            <div class="kpi"><div class="k-lbl">New Customers</div><div class="k-val">{{new_customers}}</div><div class="k-chg up">+{{cust_growth}}%</div></div>
            <div class="kpi"><div class="k-lbl">Refund Rate</div><div class="k-val">{{refund_rate}}%</div><div class="k-chg g">Healthy</div></div>
          </div>
          <h2>Top products by revenue</h2>
          <table class="doc-table"><thead><tr><th>Product</th><th>Units Sold</th><th>Revenue</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>{{product_1}}</td><td>{{units_1}}</td><td>{{revenue_1}}</td><td><span class="badge g">Top seller</span></td></tr>
            <tr><td>{{product_2}}</td><td>{{units_2}}</td><td>{{revenue_2}}</td><td><span class="badge b">Growing</span></td></tr>
            <tr><td>{{product_3}}</td><td>{{units_3}}</td><td>{{revenue_3}}</td><td><span class="badge y">Stable</span></td></tr>
            <tr><td>{{product_4}}</td><td>{{units_4}}</td><td>{{revenue_4}}</td><td><span class="badge r">Declining</span></td></tr>
            <tr class="tot"><td>Total</td><td>{{total_units}}</td><td>{{total_product_revenue}}</td><td></td></tr>
          </tbody></table>
          <h2>Revenue by channel</h2>
          <div class="chart-bar-wrap">
            <div class="bar-row"><span class="lbl">Website</span><div class="bar-track"><div class="bar-fill" style="width:78%"></div></div><span class="bval">{{ch_web}}</span></div>
            <div class="bar-row"><span class="lbl">Mobile App</span><div class="bar-track"><div class="bar-fill" style="width:52%"></div></div><span class="bval">{{ch_app}}</span></div>
            <div class="bar-row"><span class="lbl">Marketplace</span><div class="bar-track"><div class="bar-fill" style="width:30%"></div></div><span class="bval">{{ch_market}}</span></div>
            <div class="bar-row"><span class="lbl">Social</span><div class="bar-track"><div class="bar-fill" style="width:18%"></div></div><span class="bval">{{ch_social}}</span></div>
          </div>
          <hr class="divider">
          <h2>Notes &amp; observations</h2>
          <div class="note-box"><p>{{report_notes}}</p></div>
        </div>
        <div class="doc-footer"><p>Confidential · [Your Store] · {{month_year}}</p><p>Page 1 of 1</p></div>
      </div>`
    },
    {
      id:'inventory', icon:'ti-package', label:'Inventory Status Report', audience:'Internal · Operations',
      html:`<div class="doc-wrap">
        <div class="doc-head"><div class="store">YOUR STORE</div><div class="rtype">Operations Report</div><div class="rtitle">Inventory Status Report</div></div>
        <div class="doc-meta">
          <div class="doc-meta-item"><div class="lbl">Period</div><div class="val">{{report_date}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Warehouse</div><div class="val">{{warehouse_name}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Prepared by</div><div class="val">{{author_name}}</div></div>
        </div>
        <div class="doc-body">
          <h2>Stock overview</h2>
          <div class="kpi-row">
            <div class="kpi"><div class="k-lbl">Total SKUs</div><div class="k-val">{{total_skus}}</div><div class="k-chg up">In catalog</div></div>
            <div class="kpi"><div class="k-lbl">In Stock</div><div class="k-val">{{in_stock}}</div><div class="k-chg up">{{stock_pct}}% healthy</div></div>
            <div class="kpi"><div class="k-lbl">Low Stock</div><div class="k-val">{{low_stock}}</div><div class="k-chg dn">Needs reorder</div></div>
          </div>
          <h2>Stock status by category</h2>
          <table class="doc-table"><thead><tr><th>Category</th><th>SKUs</th><th>Units</th><th>Value</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>{{category_1}}</td><td>{{skus_1}}</td><td>{{units_1}}</td><td>{{value_1}}</td><td><span class="badge g">Healthy</span></td></tr>
            <tr><td>{{category_2}}</td><td>{{skus_2}}</td><td>{{units_2}}</td><td>{{value_2}}</td><td><span class="badge y">Low</span></td></tr>
            <tr><td>{{category_3}}</td><td>{{skus_3}}</td><td>{{units_3}}</td><td>{{value_3}}</td><td><span class="badge r">Critical</span></td></tr>
            <tr><td>{{category_4}}</td><td>{{skus_4}}</td><td>{{units_4}}</td><td>{{value_4}}</td><td><span class="badge g">Healthy</span></td></tr>
            <tr class="tot"><td>Total</td><td>{{total_skus}}</td><td>{{total_units}}</td><td>{{total_value}}</td><td></td></tr>
          </tbody></table>
          <h2>Items requiring immediate reorder</h2>
          <table class="doc-table"><thead><tr><th>Product</th><th>SKU</th><th>Current Stock</th><th>Reorder Qty</th></tr></thead>
          <tbody>
            <tr><td>{{reorder_product_1}}</td><td>{{sku_1}}</td><td style="color:#c62828;font-weight:700;">{{stock_level_1}}</td><td>{{reorder_qty_1}}</td></tr>
            <tr><td>{{reorder_product_2}}</td><td>{{sku_2}}</td><td style="color:#c62828;font-weight:700;">{{stock_level_2}}</td><td>{{reorder_qty_2}}</td></tr>
            <tr><td>{{reorder_product_3}}</td><td>{{sku_3}}</td><td style="color:#f57c00;font-weight:700;">{{stock_level_3}}</td><td>{{reorder_qty_3}}</td></tr>
          </tbody></table>
          <div class="note-box"><p>{{inventory_notes}}</p></div>
        </div>
        <div class="doc-footer"><p>Confidential · [Your Store] · {{report_date}}</p><p>Page 1 of 1</p></div>
      </div>`
    },
    {
      id:'customer', icon:'ti-users', label:'Customer Analytics Report', audience:'Internal · Management',
      html:`<div class="doc-wrap">
        <div class="doc-head"><div class="store">YOUR STORE</div><div class="rtype">Analytics Report</div><div class="rtitle">Customer Analytics Report</div></div>
        <div class="doc-meta">
          <div class="doc-meta-item"><div class="lbl">Period</div><div class="val">{{period}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Segment</div><div class="val">{{customer_segment}}</div></div>
          <div class="doc-meta-item"><div class="lbl">Issued</div><div class="val">{{issue_date}}</div></div>
        </div>
        <div class="doc-body">
          <h2>Customer overview</h2>
          <div class="kpi-row">
            <div class="kpi"><div class="k-lbl">Total Customers</div><div class="k-val">{{total_customers}}</div><div class="k-chg up">+{{cust_growth}}% growth</div></div>
            <div class="kpi"><div class="k-lbl">Repeat Buyers</div><div class="k-val">{{repeat_buyers}}%</div><div class="k-chg up">+{{repeat_growth}}%</div></div>
            <div class="kpi"><div class="k-lbl">Customer LTV</div><div class="k-val">{{avg_ltv}}</div><div class="k-chg up">+{{ltv_growth}}%</div></div>
          </div>
          <div class="kpi-row">
            <div class="kpi"><div class="k-lbl">Churn Rate</div><div class="k-val">{{churn_rate}}%</div><div class="k-chg g">Below target</div></div>
            <div class="kpi"><div class="k-lbl">NPS Score</div><div class="k-val">{{nps_score}}</div><div class="k-chg up">+{{nps_change}} pts</div></div>
            <div class="kpi"><div class="k-lbl">Support Tickets</div><div class="k-val">{{support_tickets}}</div><div class="k-chg dn">+{{ticket_change}}%</div></div>
          </div>
          <h2>Top customer segments</h2>

let activeCat = 'doc';
let activeId = 'monthly-sales';

function getActive() {
  return templates[activeCat].find(t => t.id === activeId);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = cats.map(c => `
    <button class="tab-btn ${c.id === activeCat ? 'active' : ''}" onclick="selectCat('${c.id}')">
      <i class="ti ${c.icon}" aria-hidden="true"></i> ${c.label}
    </button>`).join('');
}

function renderSidebar() {
  document.getElementById('sidebar').innerHTML = templates[activeCat].map(t => `
    <button class="tmpl-btn ${t.id === activeId ? 'active' : ''}" onclick="selectTmpl('${t.id}')">
      <i class="ti ${t.icon}" aria-hidden="true"></i>
      <span>${t.label}</span>
    </button>`).join('');
}

function renderPreview() {
  const t = getActive();
  if (!t) return;
  document.getElementById('prev-title').textContent = t.label;
  document.getElementById('prev-desc').textContent = t.audience;
  document.getElementById('canvas').innerHTML = t.html;
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('ok');
  btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';
}

function selectCat(id) {
  activeCat = id;
  activeId = templates[id][0].id;
  renderTabs(); renderSidebar(); renderPreview();
}

function selectTmpl(id) {
  activeId = id;
  renderSidebar(); renderPreview();
}

function doCopy() {
  const t = getActive();
  if (!t) return;
  navigator.clipboard.writeText(t.html).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('ok');
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';
    }, 2000);
  });
}

renderTabs(); renderSidebar(); renderPreview();
</script>
