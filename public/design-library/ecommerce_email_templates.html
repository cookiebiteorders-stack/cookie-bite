<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"/>
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --color-text-primary:#1c1917;
  --color-text-secondary:#57534e;
  --color-text-tertiary:#78716c;
  --color-text-info:#1d4ed8;
  --color-text-success:#15803d;
  --color-text-warning:#9a3412;
  --color-background-primary:#fafaf9;
  --color-background-secondary:#f5f5f4;
  --color-background-info:#eff6ff;
  --color-background-success:#f0fdf4;
  --color-background-warning:#fff7ed;
  --color-border-secondary:#d6d3d1;
  --color-border-tertiary:#e7e5e4;
  --color-border-success:#86efac;
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
html,body{min-height:100%;margin:0;background:var(--color-background-secondary);font-family:var(--font-sans);}
body{padding:10px 12px 16px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .layout { display: flex; gap: 0; height: 680px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; background: var(--color-background-primary); }
  .sidebar { width: 220px; min-width: 220px; border-right: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .sidebar-header p { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .sidebar-header h2 { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .template-btn { width: 100%; text-align: left; background: none; border: none; padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid var(--color-border-tertiary); transition: background 0.15s; }
  .template-btn:hover { background: var(--color-background-primary); }
  .template-btn.active { background: var(--color-background-primary); border-left: 2px solid #1a1a2e; }
  .template-btn .icon { font-size: 16px; color: var(--color-text-secondary); width: 20px; }
  .template-btn.active .icon { color: var(--color-text-primary); }
  .template-btn .label { font-size: 13px; color: var(--color-text-secondary); line-height: 1.3; }
  .template-btn.active .label { color: var(--color-text-primary); font-weight: 500; }
  .preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .preview-header { padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
  .preview-header-left { display: flex; flex-direction: column; gap: 2px; }
  .preview-header-left h3 { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .preview-header-left span { font-size: 12px; color: var(--color-text-tertiary); }
  .copy-btn { background: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .copy-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .copy-btn.copied { color: var(--color-text-success); border-color: var(--color-border-success); }
  .email-container { flex: 1; overflow-y: auto; padding: 20px; background: #f0f0f0; }
  .email-wrapper { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .email-header { background: #1a1a2e; padding: 28px 32px; text-align: center; }
  .email-header .logo { font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: 2px; font-family: Arial, sans-serif; }
  .email-body { padding: 36px 32px; }
  .email-body h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; font-family: Arial, sans-serif; }
  .email-body p { font-size: 15px; color: #444; line-height: 1.7; margin-bottom: 14px; font-family: Arial, sans-serif; }
  .email-body .greeting { font-size: 15px; color: #222; font-family: Arial, sans-serif; margin-bottom: 16px; }
  .cta-btn { display: inline-block; background: #1a1a2e; color: #fff !important; padding: 13px 28px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; font-family: Arial, sans-serif; margin: 8px 0 20px; }
  .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
  .order-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-family: Arial, sans-serif; }
  .order-table th { background: #f7f7f7; padding: 10px 12px; text-align: left; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .order-table td { padding: 11px 12px; font-size: 14px; color: #333; border-bottom: 1px solid #f0f0f0; }
  .order-table .total-row td { font-weight: 700; color: #1a1a2e; border-top: 2px solid #eee; border-bottom: none; }
  .info-box { background: #f7f8fc; border-left: 3px solid #1a1a2e; padding: 14px 16px; border-radius: 0 6px 6px 0; margin: 16px 0; font-family: Arial, sans-serif; }
  .info-box p { margin: 0; font-size: 14px; color: #444; line-height: 1.6; }
  .info-box strong { color: #1a1a2e; }
  .tracking-box { background: #f0f4ff; border-radius: 8px; padding: 16px 20px; text-align: center; margin: 20px 0; font-family: Arial, sans-serif; }
  .tracking-box .tracking-num { font-size: 20px; font-weight: 700; color: #1a1a2e; letter-spacing: 2px; }
  .tracking-box p { font-size: 12px; color: #888; margin: 4px 0 0; }
  .steps { margin: 20px 0; font-family: Arial, sans-serif; }
  .step { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .step-num { width: 28px; height: 28px; min-width: 28px; background: #1a1a2e; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .step-content h4 { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; }
  .step-content p { font-size: 13px; color: #666; margin: 0; line-height: 1.5; }
  .stars { color: #f0a500; font-size: 24px; letter-spacing: 4px; margin: 8px 0; }
  .email-footer { background: #f7f7f7; padding: 20px 32px; text-align: center; font-family: Arial, sans-serif; }
  .email-footer p { font-size: 12px; color: #999; line-height: 1.8; margin: 0; }
  .email-footer a { color: #666; text-decoration: underline; }
  .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 16px; font-family: Arial, sans-serif; }
  .tag.warning { background: #fff8e1; color: #f57c00; }
  .tag.info { background: #e3f2fd; color: #1565c0; }
  .tag.danger { background: #fce4ec; color: #c62828; }
  .two-col { display: flex; gap: 16px; margin: 16px 0; font-family: Arial, sans-serif; }
  .col-box { flex: 1; background: #f7f8fc; padding: 14px 16px; border-radius: 6px; }
  .col-box h4 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .col-box p { font-size: 14px; color: #333; margin: 0; line-height: 1.5; }
</style>

<h2 class="sr-only">E-commerce email templates viewer with 9 professional templates</h2>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Email Templates</h2>
      <p>9 templates</p>
    </div>
    <div id="template-list"></div>
  </div>
  <div class="preview-pane">
    <div class="preview-header">
      <div class="preview-header-left">
        <h3 id="preview-title">Welcome Email</h3>
        <span id="preview-subject">Subject: Welcome to [Your Store] 🎉</span>
      </div>
      <button class="copy-btn" id="copy-btn" onclick="copyHTML()">
        <i class="ti ti-copy" aria-hidden="true"></i> Copy HTML
      </button>
    </div>
    <div class="email-container" id="email-container"></div>
  </div>
</div>

<script>
const templates = [
  {
    id: 'welcome',
    icon: 'ti-hand-stop',
    label: 'Welcome Email',
    subject: 'Subject: Welcome to [Your Store]!',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">

        <h1>Welcome aboard, {{first_name}}!</h1>
        <p class="greeting">Hi {{first_name}},</p>
        <p>Thank you for creating an account with <strong>[Your Store]</strong>. We're thrilled to have you as part of our community.</p>
        <p>Your account is now ready. Start browsing our latest collections and enjoy a seamless shopping experience.</p>
        <div style="text-align:center;margin:24px 0;"><a class="cta-btn" href="#">Start Shopping</a></div>
        <div class="info-box"><p>🎁 <strong>Welcome Offer:</strong> Use code <strong>WELCOME10</strong> for 10% off your first order. Valid for 30 days.</p></div>
        <hr class="divider">
        <p style="font-size:13px;color:#888;">Need help? Reply to this email or visit our <a href="#" style="color:#1a1a2e;">Help Center</a>.</p>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address, City, Country]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'order-confirm',
    icon: 'ti-receipt',
    label: 'Order Confirmation',
    subject: 'Subject: Order Confirmed – #{{order_number}}',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag">Order Confirmed</span>
        <h1>Thank you for your order!</h1>
        <p class="greeting">Hi {{first_name}},</p>
        <p>We've received your order and it's being processed. Here's a summary:</p>
        <table class="order-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td>{{product_name_1}}</td><td>{{qty_1}}</td><td>{{price_1}}</td></tr>
            <tr><td>{{product_name_2}}</td><td>{{qty_2}}</td><td>{{price_2}}</td></tr>
            <tr class="total-row"><td colspan="2">Total</td><td>{{total_amount}}</td></tr>
          </tbody>
        </table>
        <div class="two-col">
          <div class="col-box"><h4>Shipping to</h4><p>{{customer_name}}<br>{{shipping_address}}</p></div>

        </div>
        <div style="text-align:center;margin:20px 0;"><a class="cta-btn" href="#">View My Order</a></div>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'shipped',
    icon: 'ti-truck',
    label: 'Order Shipped',
    subject: 'Subject: Your order is on its way! 📦',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">

        <h1>Your order is on its way!</h1>

    </div>`

  {
    id: 'delivered',
    icon: 'ti-package',
    label: 'Order Delivered',
    subject: 'Subject: Your order has been delivered ✅',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag">Delivered</span>

      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'password-reset',
    icon: 'ti-lock',
    label: 'Password Reset',
    subject: 'Subject: Reset your password',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag warning">Security</span>
        <h1>Reset your password</h1>

      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'abandoned-cart',
    icon: 'ti-shopping-cart',
    label: 'Abandoned Cart',
    subject: 'Subject: You left something behind…',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag warning">Reminder</span>
        <h1>Your cart is waiting for you</h1>
        <p class="greeting">Hi {{first_name}},</p>
        <p>You left some items in your cart. Don't let them sell out — complete your purchase before they're gone.</p>
        <table class="order-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td>{{product_name_1}}</td><td>{{qty_1}}</td><td>{{price_1}}</td></tr>
            <tr><td>{{product_name_2}}</td><td>{{qty_2}}</td><td>{{price_2}}</td></tr>
            <tr class="total-row"><td colspan="2">Cart Total</td><td>{{cart_total}}</td></tr>
          </tbody>
        </table>
        <div style="text-align:center;margin:24px 0;"><a class="cta-btn" href="#">Complete My Purchase</a></div>
        <div class="info-box"><p>🎁 <strong>Special offer:</strong> Use <strong>COMEBACK5</strong> for an extra 5% off your order today.</p></div>
        <p style="font-size:13px;color:#888;">This offer expires in {{offer_expiry}}.</p>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'review',
    icon: 'ti-star',
    label: 'Review Request',
    subject: 'Subject: How was your order? Leave a review',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag">Feedback</span>
        <h1>How did we do?</h1>
        <p class="greeting">Hi {{first_name}},</p>
        <p>We hope you're loving your recent purchase from <strong>[Your Store]</strong>. Your feedback means the world to us — and to other shoppers!</p>
        <p>It only takes 30 seconds. Click a star to rate your experience:</p>
        <div style="text-align:center;">
          <div class="stars">★ ★ ★ ★ ★</div>
          <p style="font-size:13px;color:#888;margin-bottom:20px;">Tap a star to leave your rating</p>
          <a class="cta-btn" href="#">Write a Review</a>
        </div>
        <hr class="divider">
        <p style="font-size:13px;color:#888;">Reviewing your order: <strong>{{product_name}}</strong> (Order #{{order_number}})</p>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'refund',
    icon: 'ti-rotate',
    label: 'Refund Confirmed',
    subject: 'Subject: Your refund has been processed',
    html: `<div class="email-wrapper">
      <div class="email-header"><div class="logo">YOUR STORE</div></div>
      <div class="email-body">
        <span class="tag info">Refund Processed</span>
        <h1>Your refund is on its way</h1>
        <p class="greeting">Hi {{first_name}},</p>
        <p>We've successfully processed your refund for order <strong>#{{order_number}}</strong>. Here are the details:</p>
        <div class="two-col">
          <div class="col-box"><h4>Refund Amount</h4><p><strong>{{refund_amount}}</strong></p></div>
          <div class="col-box"><h4>Refunded To</h4><p>{{payment_method}}</p></div>

        <div class="steps">

        <div style="text-align:center;"><a class="cta-btn" href="#">View Refund Details</a></div>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  },
  {
    id: 'promo',
    icon: 'ti-speakerphone',
    label: 'Promotional Email',
    subject: 'Subject: {{offer_name}} – Don\'t miss out!',
    html: `<div class="email-wrapper">
      <div class="email-header" style="background:#1a1a2e;padding:32px;">
        <div class="logo">YOUR STORE</div>
        <div style="margin-top:16px;font-size:32px;font-weight:800;color:#fff;letter-spacing:-1px;font-family:Arial;">{{offer_percentage}}% OFF</div>

        <div class="tracking-box">

        </div>
        <div style="text-align:center;margin:24px 0;"><a class="cta-btn" href="#">Shop the Sale</a></div>
        <hr class="divider">
        <p style="font-size:12px;color:#aaa;">Terms apply. Offer valid until {{expiry_date}} at 11:59 PM. Cannot be combined with other offers.</p>
      </div>
      <div class="email-footer"><p>© 2025 [Your Store]. All rights reserved.<br>[Company Address]<br><a href="#">Unsubscribe</a> · <a href="#">Privacy Policy</a></p></div>
    </div>`
  }
];

let activeId = 'welcome';

function render() {
  const list = document.getElementById('template-list');
  list.innerHTML = templates.map(t => `
    <button class="template-btn ${t.id === activeId ? 'active' : ''}" onclick="select('${t.id}')">
      <i class="ti ${t.icon} icon" aria-hidden="true"></i>
      <span class="label">${t.label}</span>
    </button>
  `).join('');

  const active = templates.find(t => t.id === activeId);
  document.getElementById('preview-title').textContent = active.label;
  document.getElementById('preview-subject').textContent = active.subject;
  document.getElementById('email-container').innerHTML = active.html;
}

function select(id) {
  activeId = id;
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('copied');
  btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';
  render();
}

function copyHTML() {
  const active = templates.find(t => t.id === activeId);
  navigator.clipboard.writeText(active.html).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy HTML';
    }, 2000);
  });
}

render();
</script>
</body></html>
